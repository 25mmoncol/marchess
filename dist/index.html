<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MarChess – Next Best Chess Move & FEN Analyzer</title>
  <meta name="description" content="Build a custom chess position, find Stockfish's best move, and play from there.">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <header>
    <div class="brand"><img src="pieces/staunty/wN.svg" alt="" aria-hidden="true"><span>MarChess</span></div>
    <span class="engine" id="engine">Loading Stockfish…</span>
  </header>
  <main>
    <section class="play">
      <div class="board-heading">
        <button id="flip">Flip board</button>
      </div>
      <div class="board-layout">
        <div class="evaluation" aria-label="Position evaluation">
          <div id="eval-track" class="eval-track" role="meter" aria-label="White's advantage" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="No evaluation">
            <div id="eval-fill" class="eval-fill"></div>
          </div>
          <output id="eval-number" class="eval-number">—</output>
        </div>
        <div class="board-wrap" id="board-wrap"><div id="board" class="board" aria-label="Chessboard"></div><svg id="move-arrows" class="move-arrows" viewBox="0 0 800 800" aria-hidden="true"></svg></div>
      </div>
      <div class="under">
        <span id="modeText">Analysis mode</span>
      </div>
      <div class="toolbar"><button id="undo">Undo move</button></div>
      <p id="message" role="status"></p>
      <div id="history" class="history"></div>
      <section class="panel fen-panel">
        <div class="section-label">LOAD A POSITION</div>
        <label for="fen">FEN</label>
        <textarea id="fen" rows="2" spellcheck="false"></textarea>
        <button id="load">Load FEN</button>
        <button id="copy">Copy FEN</button>
      </section>
    </section>
    <aside>
      <section class="panel analysis-panel">
        <div class="analysis-heading">
          <div class="result">
            <span id="best">Find your next move</span>
          </div>
          <details class="settings-menu">
            <summary>Settings</summary>
            <div class="settings-options">
              <div class="section-label">SETTINGS</div>
              <label for="board-theme">Board appearance</label>
              <select id="board-theme">
                <option value="classic">Gray</option>
                <option value="blue" selected>Blue</option>
                <option value="green">Green</option>
                <option value="walnut">Walnut</option>
              </select>
              <label class="setting-toggle"><input id="coordinates-toggle" type="checkbox" checked>Show coordinates</label>
            </div>
          </details>
        </div>
        <p id="line"></p>
        <div class="analysis-controls">
          <div class="analysis-choices" role="group" aria-label="Find the best move for">
            <button class="white-move" id="analyze-white" disabled>White best move</button>
            <button class="black-move" id="analyze-black" disabled>Black best move</button>
            <button id="apply" disabled>Play suggested move</button>
            <select id="time" aria-label="Thinking time">
              <option value="1000">1s · ~3000 Elo</option>
              <option value="3000" selected>3s · ~3200 Elo</option>
              <option value="10000">10s · ~4000 Elo?</option>
            </select>
            <div class="rights top-three-setting">
              <label><input id="top-three" type="checkbox" title="When enabled, either best-move button shows three ranked candidates.">Show top 3 moves</label>
            </div>
            <button id="restart" hidden>Restart Stockfish</button>
          </div>
        </div>
        <select id="side" hidden aria-hidden="true" tabindex="-1">
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
        <div id="depth" class="muted"></div>
      </section>
      <section class="panel" id="editor">
        <div class="section-label">EDIT THE POSITION</div>
        <div id="palette" class="palette"></div>
        <div class="rights" aria-label="Castling rights">
          <label><input type="checkbox" value="w">White can castle</label>
          <label><input type="checkbox" value="b">Black can castle</label>
        </div>
        <button id="reset">Starting position</button>
        <button id="clear">Clear board</button>
      </section>
      <section class="panel game-panel">
        <div class="section-label">PLAY A GAME</div>
        <button id="play">Start game</button>
        <button id="stop" hidden>Return to analysis</button>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
